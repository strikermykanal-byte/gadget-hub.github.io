<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel = "stylesheet" href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="image/gadgethub.png">
    <title>GadgetHub</title>
</head>
 <body>

    <header class="header">

        <a href="index.html" class="logo">
            <img src="image/logo.png" alt="GadgetHub Logo">
        </a>

        <form class="search" action="product.html" method="get">
            <input
                type="text"
                name="query"
                placeholder="Search products..."
            >

            <button type="submit">
                <i class="fas fa-search"></i>
            </button>
        </form>

        <div class="header-actions">

            <a href="signup.html" class="header-link">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>

            <a href="cart.html" class="header-link">
                <i class="fa-solid fa-basket-shopping"></i>
                <span>Cart</span>
            </a>

        </div>

    </header>


    <main>

        <div class="product-container"></div>

    </main>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
