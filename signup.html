 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">

    <link rel = "stylesheet" href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="image/gadgethub.png">
    <title>GadgetHub</title>
 </head>
 <body>
    <div class="container">
        <p>Sign up to GadgetHub</p>
        <form id="signup-form" method="post">
    <label for="email">
            <b>
                Email
                <i class="fa-solid fa-envelope"></i>
            </b>
            </label>
                <input type="email" id="email" name="email" placeholder=registerform@register.yep required>




        <label for="password">
           <b>
            Password
            <i class="fa-solid fa-lock"></i>
           </b>
            <input type="password" id="password" name="password" placeholder="Enter your password">
        </label>

        <label for="psw-repeat"><b>
            Confirm password
            <i class="fa-solid fa-lock"></i> </b></label>
        <input
        type="password"
        placeholder="Repeat password"
        name="psw-repeat"
        id="psw-repeat" required
        >
        <button type="submit" class="registerBtn">LOG UP</button>
        </label>
    </form>
    </div>


    <script src="signup.js"></script>
 </body>
  </html>
